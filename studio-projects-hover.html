<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Projects Hover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Archivo+Black&display=swap">
<style>
  /* Layout: header, filter tabs, big project list with cursor-following card, marquee, footer */
  :root {
    --page: #efefef;
    --ink: #111111;
    --active: #2b18ff;
    --line: rgba(0,0,0,.18);
    --ui: "Inter", "Helvetica Neue", Arial, sans-serif;
    --mark: "Archivo Black", "Arial Black", sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 500 14px/1.4 var(--ui);
    transition: background-color .45s var(--ease);
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--active); outline-offset: 3px; }

  header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 2.6vw 6.5vw; font-size: max(12px, 1.1vw); font-weight: 600;
  }
  header nav { display: flex; gap: max(12px, 1.2vw); }
  header nav:last-child { justify-content: flex-end; }
  .mark { font: max(18px, 2.1vw)/1 var(--mark); letter-spacing: -.02em; }

  .filters {
    display: flex; flex-wrap: wrap; gap: 6px 2.4vw;
    padding: 6vw 3.65vw 1.6vw;
  }
  .filters button {
    all: unset; cursor: pointer; font-size: max(11px, 1.3vw); font-weight: 700; letter-spacing: .01em; text-transform: uppercase;
  }
  .filters button[aria-pressed="true"] { color: var(--active); }

  .list { list-style: none; margin: 0; padding: 0 4.15vw 10vw 3.65vw; min-height: 40vh; }
  .row {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    animation: rowIn .45s var(--ease) both;
  }
  .row a {
    font: 700 max(22px, 4.2vw)/1.26 var(--ui); letter-spacing: -.02em;
    transition: color .2s;
  }
  .row .meta { font-size: max(10px, 1.2vw); font-weight: 400; text-align: right; line-height: 1.33; flex-shrink: 0; }
  .row.hot a { color: #fff; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .card {
    position: fixed; left: 0; top: 0; width: 35.5vw; aspect-ratio: 1;
    pointer-events: none; z-index: 5; opacity: 0;
    transition: opacity .25s;
    will-change: transform;
  }
  .card.on { opacity: 1; }
  .art {
    position: absolute; inset: 0; overflow: hidden;
    display: grid; place-items: center; text-align: center;
    box-shadow: 0 30px 60px rgba(0,0,0,.25);
  }
  .art b { position: relative; font: 3vw/0.95 var(--mark); letter-spacing: -.02em; text-transform: uppercase; padding: 0 16px; }
  .art i { position: absolute; display: block; }

  .marquee { border-block: 1px solid var(--line); overflow: hidden; white-space: nowrap; padding: .9vw 0; font-size: max(12px, 1.5vw); }
  .marquee div { display: inline-block; animation: slide 30s linear infinite; }
  .marquee span { padding-right: 18px; }
  @keyframes slide { to { transform: translateX(-50%); } }

  footer { display: flex; justify-content: space-between; align-items: center; padding: 6vw 4.5vw 8vw; font-size: max(12px, 1.5vw); }
  footer .cols { display: flex; gap: 8.5vw; }
  footer .cols div { display: flex; flex-direction: column; line-height: 1.6; }
  .badge {
    width: max(44px, 5.2vw); height: max(44px, 5.2vw); border-radius: 50%; background: var(--active); color: #fff;
    display: grid; place-items: center; font: max(9px, .9vw) var(--mark);
  }

  @media (max-width: 600px) {
    header { padding: 14px 16px; gap: 12px; }
    header nav:last-child a:first-child { display: none; }
    .filters { padding: 40px 16px 14px; }
    .list { padding: 0 16px 80px; }
    footer { padding: 32px 16px 40px; }
    footer .cols { gap: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    body, .row, .marquee div { transition: none; animation: none; }
  }
</style>
</head>
<body>
<header>
  <nav><a href="#">About</a><a href="#">Projects</a></nav>
  <a class="mark" href="#">studio’</a>
  <nav><a href="#">Architecture</a><a href="#">Contact</a></nav>
</header>

<div class="filters" id="filters" role="toolbar" aria-label="Filter projects"></div>
<ul class="list" id="list"></ul>

<div class="card" id="card" aria-hidden="true"><div class="art" id="art"></div></div>

<div class="marquee" aria-hidden="true"><div id="marquee"></div></div>
<footer>
  <div class="cols">
    <div><a href="#">Home ↗</a><a href="#">Projects ↗</a><a href="#">Contact ↗</a></div>
    <div><a href="#">LinkedIn ↗</a><a href="#">Facebook ↗</a><a href="#">Instagram ↗</a></div>
  </div>
  <div class="badge">studio’</div>
</footer>

<script>
  // Placeholder projects. bg = page color on hover, art = [card color, shape color, text color]
  const PROJECTS = [
    { n: 'Halo Skincare',   c: ['Packaging'],                       y: 2025, bg: '#9aa6e0', art: ['#16161a', '#3a3a44', '#ffffff'], s: 'arch' },
    { n: 'Mira',            c: ['Brand Identity', 'Naming'],        y: 2024, bg: '#c9c9c9', art: ['#ff4b3e', '#ffffff', '#ffffff'], s: 'circle' },
    { n: 'Pulse Pay',       c: ['Brand Identity', 'Social Media'],  y: 2024, bg: '#8d7a8e', art: ['#3fae4f', '#1f7a30', '#ffffff'], s: 'stripes' },
    { n: 'Nordic Oat',      c: ['Brand Identity', 'Packaging'],     y: 2024, bg: '#f1d8c4', art: ['#e8cfb4', '#c46a5a', '#3a2a20'], s: 'circle' },
    { n: 'Kiln Bakery',     c: ['Brand Identity', 'Logotype'],      y: 2024, bg: '#ff4363', art: ['#1b1b1b', '#7b2cff', '#ffffff'], s: 'blob' },
    { n: 'Fern & Co',       c: ['Brand Identity'],                  y: 2023, bg: '#c3a6e6', art: ['#e9dfcf', '#b38a4a', '#2a2a2a'], s: 'arch' },
    { n: 'Orbit Studios',   c: ['Logotype', 'Brand Identity'],      y: 2022, bg: '#ff4b6e', art: ['#13131a', '#8b3dff', '#ffffff'], s: 'blob' },
    { n: 'Lumen Dental',    c: ['Social Media', 'Brand Identity'],  y: 2022, bg: '#e2462f', art: ['#14897f', '#0f5f58', '#ffffff'], s: 'stripes' },
    { n: 'Driftwood Coffee',c: ['Packaging', 'Illustration'],       y: 2022, bg: '#f7b21c', art: ['#2c1f7a', '#f4c13c', '#ffffff'], s: 'circle' },
    { n: 'Saltwater',       c: ['Logotype', 'Naming'],              y: 2022, bg: '#dcf51c', art: ['#3b3248', '#c9b8e6', '#ffffff'], s: 'arch' },
    { n: 'Vela Courts',     c: ['Illustration'],                    y: 2021, bg: '#ff4fae', art: ['#1d1d27', '#2fd1ff', '#ffffff'], s: 'stripes' },
    { n: 'Moss Detox',      c: ['Illustration', 'Packaging'],       y: 2020, bg: '#56c2f2', art: ['#f2e4d4', '#ee6a4c', '#1d1d1d'], s: 'blob' },
    { n: 'Tilde',           c: ['Logotype', 'Naming'],              y: 2021, bg: '#47bde8', art: ['#e8e2d8', '#1b1b1b', '#1b1b1b'], s: 'circle' },
    { n: 'Wavewall',        c: ['Logotype'],                        y: 2021, bg: '#e52b2b', art: ['#d92020', '#ffffff', '#ffffff'], s: 'stripes' }
  ];
  const CATS = ['All Projects', 'Brand Identity', 'Social Media', 'Packaging', 'Logotype', 'Illustration', 'Naming'];

  const list = document.getElementById('list');
  const filters = document.getElementById('filters');
  const card = document.getElementById('card');
  const art = document.getElementById('art');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pageBg = getComputedStyle(document.documentElement).getPropertyValue('--page').trim();

  function paintArt(p) {
    const [bg, shape, text] = p.art;
    art.style.background = bg;
    art.style.color = text;
    const shapes = {
      circle: `<i style="width:70%;aspect-ratio:1;border-radius:50%;background:${shape};left:-10%;bottom:-12%"></i>`,
      arch: `<i style="width:60%;height:70%;border-radius:999px 999px 0 0;background:${shape};right:8%;bottom:0"></i>`,
      stripes: `<i style="inset:0;background:repeating-linear-gradient(-35deg, ${shape} 0 18px, transparent 18px 44px)"></i>`,
      blob: `<i style="width:85%;height:55%;border-radius:60% 40% 55% 45%/50% 60% 40% 50%;background:${shape};left:-15%;top:-10%;transform:rotate(-20deg)"></i>`
    };
    art.innerHTML = shapes[p.s] + `<b>${p.n}</b>`;
  }

  let current = 'All Projects';
  function render() {
    list.innerHTML = '';
    const all = current === 'All Projects';
    PROJECTS.filter(p => all || p.c.includes(current)).forEach((p, i) => {
      const li = document.createElement('li');
      li.className = 'row';
      li.style.animationDelay = (i * 30) + 'ms';
      const meta = all ? `${p.c[0].toLowerCase()}<br>${p.y}` : p.y;
      li.innerHTML = `<a href="#">${p.n}</a><span class="meta">${meta}</span>`;
      const a = li.querySelector('a');
      const on = () => activate(p, li);
      a.addEventListener('mouseenter', on);
      a.addEventListener('focus', on);
      a.addEventListener('mouseleave', deactivate);
      a.addEventListener('blur', deactivate);
      a.addEventListener('click', e => e.preventDefault());
      list.appendChild(li);
    });
  }

  CATS.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = c;
    b.setAttribute('aria-pressed', c === current);
    b.addEventListener('click', () => {
      current = c;
      [...filters.children].forEach(x => x.setAttribute('aria-pressed', x === b));
      deactivate();
      render();
    });
    filters.appendChild(b);
  });

  // Cursor-following card. Tilt grows with height on screen: about -7deg near the top, +19deg near the bottom
  let mx = innerWidth / 2, my = innerHeight / 2, x = mx, y = my, hot = null;
  addEventListener('pointermove', e => { mx = e.clientX; my = e.clientY; });
  function activate(p, li) {
    if (hot) hot.classList.remove('hot');
    hot = li; li.classList.add('hot');
    document.body.style.backgroundColor = p.bg;
    paintArt(p);
    if (matchMedia('(hover: hover)').matches) card.classList.add('on');
  }
  function deactivate() {
    if (hot) hot.classList.remove('hot');
    hot = null;
    document.body.style.backgroundColor = pageBg;
    card.classList.remove('on');
  }
  function loop() {
    const k = reduce ? 1 : 0.14;
    x += (mx - x) * k; y += (my - y) * k;
    const rot = (y / innerHeight - 0.5) * 50;
    const h = card.offsetHeight;
    card.style.transform = `translate(${x + 40}px, ${y - h / 2}px) rotate(${rot}deg)`;
    requestAnimationFrame(loop);
  }

  document.getElementById('marquee').innerHTML =
    Array(16).fill('<span>hello@studio.example</span><span>Let’s work together</span>').join('');

  render();
  loop();
</script>
</body>
</html>
