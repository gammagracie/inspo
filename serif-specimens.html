<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ten Quiet Serifs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&family=Alice&family=Averia+Serif+Libre:ital,wght@0,300;0,400;0,700;1,400&family=Caudex:ital,wght@0,400;0,700;1,400&family=Domine:wght@400..700&family=Gilda+Display&family=Kavoon&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,400&family=Prata&family=Solway:wght@300;400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: sticky tester bar, then a two-column grid of specimen cards. One column on phones. */
  :root {
    --paper: #f3efe7;
    --ink: #1c1a17;
    --muted: #7a7368;
    --rule: #d8d1c4;
    --card: #fbf8f2;
    --accent: #a23b22;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#171512; --ink:#ede7dc; --muted:#968e81; --rule:#2e2a25; --card:#1f1c18; --accent:#e0805f; color-scheme: dark } }
  :root[data-theme="dark"] { --paper:#171512; --ink:#ede7dc; --muted:#968e81; --rule:#2e2a25; --card:#1f1c18; --accent:#e0805f; color-scheme: dark }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 "Literata", Georgia, serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }

  header.top { padding-block: 56px 28px; display: grid; gap: 10px; }
  header.top h1 { font: 400 clamp(44px, 8vw, 104px)/0.95 "Gilda Display", Georgia, serif; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
  header.top p { margin: 0; max-width: 60ch; color: var(--muted); }
  header.top a { color: var(--accent); }

  .tester {
    position: sticky; top: 0; z-index: 5; background: var(--paper);
    border-block: 1px solid var(--rule); padding-block: 12px;
  }
  .tester .wrap { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  .tester label { font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .tester input[type="text"] {
    flex: 1 1 280px; min-width: 0; font: 16px "Literata", Georgia, serif; color: var(--ink);
    background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 8px 10px;
  }
  .tester input[type="range"] { width: 140px; accent-color: var(--accent); }
  .tester output { font: 500 11px var(--mono); width: 3.5em; color: var(--ink); }
  .tester button {
    font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 999px;
    padding: 8px 12px; cursor: pointer;
  }
  .tester button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin-block: 32px 64px; }
  .spec { background: var(--card); padding: 24px 24px 28px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .meta { display: flex; justify-content: space-between; gap: 12px; font: 500 11px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .meta .num { color: var(--accent); }
  .name { font-size: clamp(34px, 4.6vw, 56px); line-height: 1; margin: 0; text-wrap: balance; }
  .row { display: flex; align-items: flex-end; gap: 18px; min-width: 0; padding-bottom: 14px; }
  .glyph { font-size: clamp(72px, 9vw, 120px); line-height: .85; flex-shrink: 0; }
  .alpha { font-size: 18px; line-height: 1.35; word-break: break-word; min-width: 0; color: var(--muted); }
  .sample { font-size: var(--size, 28px); line-height: 1.15; margin: 0; word-break: break-word; }
  .para { font-size: 15px; line-height: 1.55; margin: 0; max-width: 60ch; }
  .weights { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 18px; }
  .foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: 11px/1.4 var(--mono); color: var(--muted); margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--rule); }
  .foot a { color: var(--accent); text-decoration: none; }
  .foot a:hover { text-decoration: underline; }

  footer { padding-block: 0 48px; font: 11px/1.5 var(--mono); color: var(--muted); }

  @media (max-width: 760px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .spec { padding: 20px 16px 24px; }
  }
</style>
</head>
<body>
<header class="top wrap">
  <h1>Ten Quiet Serifs</h1>
  <p>A specimen of ten free serifs on Google Fonts, from the list in <a href="https://shambhaviojha.medium.com/10-beautiful-serifs-on-google-fonts-you-probably-havent-seen-before-97a56efa0000">Shambhavi Ojha’s article</a>. Type in the box to try your own words in every face.</p>
</header>

<div class="tester">
  <div class="wrap">
    <input type="text" id="text" aria-label="Sample text" value="The quick brown fox jumps over the lazy dog">
    <label for="size">Size <input type="range" id="size" min="16" max="72" value="28"><output id="size-out">28px</output></label>
    <button type="button" id="italic" aria-pressed="false">Italic</button>
    <button type="button" id="theme">Dark</button>
  </div>
</div>

<main class="wrap">
  <div class="grid" id="grid"></div>
</main>

<footer class="wrap">All fonts load from Google Fonts and are free under the SIL Open Font License.</footer>

<script>
  const FONTS = [
    { f: 'Viaoda Libre',       role: 'Display', by: 'Viktoriya Grabowska',  w: [400] },
    { f: 'Alice',              role: 'Text',    by: 'Ksenia Erulevich',     w: [400] },
    { f: 'Averia Serif Libre', role: 'Text',    by: 'Dan Sayers',           w: [300, 400, 700], it: true },
    { f: 'Caudex',             role: 'Text',    by: 'Nidud',                w: [400, 700], it: true },
    { f: 'Domine',             role: 'Text',    by: 'Impallari Type',       w: [400, 500, 600, 700] },
    { f: 'Gilda Display',      role: 'Display', by: 'Eduardo Tunni',        w: [400] },
    { f: 'Kavoon',             role: 'Display', by: 'Eduardo Tunni',        w: [400] },
    { f: 'Literata',           role: 'Text',    by: 'TypeTogether',         w: [200, 400, 600, 900], it: true },
    { f: 'Prata',              role: 'Display', by: 'Cyreal',               w: [400] },
    { f: 'Solway',             role: 'Text',    by: 'The Northern Block',   w: [300, 400, 500, 700, 800] }
  ];
  const PARA = 'Good type disappears into the reading. These ten earn a second look at large sizes and hold up in a paragraph.';

  const grid = document.getElementById('grid');
  FONTS.forEach((x, i) => {
    const fam = `"${x.f}", Georgia, serif`;
    const el = document.createElement('article');
    el.className = 'spec';
    el.style.fontFamily = fam;
    el.innerHTML = `
      <div class="meta"><span class="num">${String(i + 1).padStart(2, '0')}</span><span>${x.role} · ${x.w.length} weight${x.w.length > 1 ? 's' : ''}${x.it ? ' + italic' : ''}</span></div>
      <h2 class="name">${x.f}</h2>
      <div class="row"><span class="glyph" aria-hidden="true">Ag</span><span class="alpha">ABCDEFGHIJKLM<br>abcdefghijklm<br>0123456789 &amp;?!</span></div>
      <p class="sample" data-it="${x.it ? 1 : 0}"></p>
      <p class="para">${PARA}</p>
      <div class="weights">${x.w.map(w => `<span style="font-weight:${w}">${w}</span>`).join('')}</div>
      <div class="foot"><span>by ${x.by}</span><a href="https://fonts.google.com/specimen/${x.f.replace(/ /g, '+')}">Google Fonts ↗</a></div>`;
    grid.appendChild(el);
  });

  const text = document.getElementById('text');
  const size = document.getElementById('size');
  const sizeOut = document.getElementById('size-out');
  const italic = document.getElementById('italic');
  const samples = [...document.querySelectorAll('.sample')];
  const sync = () => {
    samples.forEach(s => {
      s.textContent = text.value || ' ';
      s.style.fontStyle = italic.getAttribute('aria-pressed') === 'true' && s.dataset.it === '1' ? 'italic' : 'normal';
    });
    document.documentElement.style.setProperty('--size', size.value + 'px');
    sizeOut.textContent = size.value + 'px';
  };
  text.addEventListener('input', sync);
  size.addEventListener('input', sync);
  italic.addEventListener('click', () => { italic.setAttribute('aria-pressed', italic.getAttribute('aria-pressed') !== 'true'); sync(); });
  sync();

  const root = document.documentElement;
  const btn = document.getElementById('theme');
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const syncTheme = () => { btn.textContent = isDark() ? 'Light' : 'Dark'; };
  try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch (e) {}
  syncTheme();
  btn.addEventListener('click', () => {
    root.dataset.theme = isDark() ? 'light' : 'dark';
    try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
    syncTheme();
  });
</script>
</body>
</html>
